server {
    listen 80;
    listen [::]:80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;

    location = / {
        return 302 /fair-spin/;
    }

    location = /fair-spin/sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /fair-spin/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /fair-spin/ {
        try_files $uri $uri/ /fair-spin/index.html;
    }
}
